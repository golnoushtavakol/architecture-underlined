List.add('textonly')"></a>`:''}<div>${link(u,`<span class="eyebrow">${esc(t)}</span><h3>${esc(h)}</h3>`)}<div class="meta">${esc(m)}</div><p class="summary">${esc(s)}</p>${link(u,'<span class="small-link">Read at source</span>')}</div></article>`}function item(a){let[t,h,s,u]=a;return link(u,`<article class="story"><span class="eyebrow">${esc(t)}</span><h3>${esc(h)}</h3><p class="summary">${esc(s)}</p><span class="small-link">Read at source</span></article>`)}function eventHTML(a,i){let[d,t,h,venue,org,type,group,why,u,status,endDate,rsvp]=a;let date=new Date(d+'T12:00:00');return `<article class="event" data-kind="${esc(group)}" data-format="${esc(type)}"><div class="date"><span>${date.toLocaleString('en-US',{month:'short'}).toUpperCase()}</span><b>${date.getDate()}</b><span>${date.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase()}</span></div><div><span class="eyebrow">${esc(type)} · ${esc(group)}</span><h3>${link(u,esc(h))}</h3><div class="details">${endDate ? `On view through ${esc(new Date(endDate+'T12:00:00').toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric'}))} · ` : ''}${esc(t||'Time on organizer page')} · ${esc(venue)} · ${esc(org)}</div><div class="why">${esc(why)}</div><div class="status">${esc(status)}</div>${link(u,'<span class="small-link">Organizer announcement ↗</span>')}${rsvp ? ' · ' + link(rsvp,'<span class="small-link">RSVP ↗</span>') : ''}</div></article>`}

panels.innerHTML += section('source','Sources','Copyrights belong to the original sources. Architecture Underlined curates their work.',data.sources.map(([name,url]) => `<div class="story">${link(url,esc(name))}</div>`).join(''));

const formatDate = value => new Intl.DateTimeFormat('en-US', {

document.title = 'Architecture Underlined · ' + formatDate(edition.date);

function newsStory(story) {

function addArchiveMenus(dates) {
