name: Publish Architecture Underlined

on:
  push:
    branches: [main]
    paths:
      - index.html
      - archive/**
      - events/listings.json
      - scripts/publish_edition.py
      - scripts/discover_events.py
      - .github/workflows/daily.yml
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"
      timezone: America/New_York

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: architecture-underlined-v2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover public NYC design events
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/discover_events.py

      - name: Generate edition and archive
        run: python scripts/publish_edition.py

      - name: Commit edition and archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archive/
          if ! git diff --cached --quiet; then
            git commit -m "Publish Architecture Underlined"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -d archive ]; then
            cp -r archive _site/archive
          fi
          touch _site/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
