name: Publish Architecture Underlined

on:
  schedule:
    # GitHub schedules run in UTC. Both hours cover 08:00 in New York across DST.
    - cron: '0 12,13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: architecture-underlined-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install feed parsing tools
        run: python -m pip install --quiet feedparser beautifulsoup4
      - name: Build today's Underlined headlines and archive
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python <<'PY'
          import datetime as dt, os, re, socket
          from collections import defaultdict
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import feedparser
          from bs4 import BeautifulSoup

          socket.setdefaulttimeout(18)
          TZ = ZoneInfo('America/New_York')
          now = dt.datetime.now(TZ)
          if os.environ.get('GITHUB_EVENT_NAME') == 'schedule' and now.hour != 8:
              print('Outside 8 AM New York publication window; skipping duplicate UTC run.')
              raise SystemExit(0)
          issue = now.strftime('%Y-%m-%d')
          # Curated feed endpoints are candidates; unavailable sources are skipped.
          feeds = {
              'ArchDaily': 'https://www.archdaily.com/rss',
              'Dezeen': 'https://www.dezeen.com/feed/',
              "The Architect's Newspaper": 'https://www.archpaper.com/feed/',
              'designboom': 'https://www.designboom.com/feed/',
              'Archinect': 'https://archinect.com/news/rss',
              'Metropolis': 'https://metropolismag.com/feed/',
              'Wallpaper*': 'https://www.wallpaper.com/feed',
              'Domus': 'https://www.domusweb.it/en/rss.html',
          }
          max_age = dt.timedelta(days=14)
          found = []
          for name, url in feeds.items():
              try:
                  f = feedparser.parse(url, request_headers={'User-Agent':'ArchitectureUnderlined/1.0 (+curated architecture links)'})
                  count = 0
                  for e in f.entries:
                      title = BeautifulSoup(e.get('title', ''), 'html.parser').get_text(' ', strip=True)
                      link = e.get('link','').strip()
                      published = e.get('published_parsed') or e.get('updated_parsed')
                      if not title or not link.startswith('https://') or not published: continue
                      stamp = dt.datetime(*published[:6], tzinfo=dt.timezone.utc).astimezone(TZ)
                      if stamp > now + dt.timedelta(hours=3) or now - stamp > max_age: continue
                      found.append((stamp, name, title, link))
                      count += 1
                  print(f'{name}: {count} dated recent items')
              except Exception as err:
                  print(f'{name}: unable to fetch ({err})')

          found.sort(key=lambda a:a[0], reverse=True)
          seen, per_source, selected = set(), defaultdict(int), []
          for stamp, name, title, link in found:
              key = re.sub(r'[^a-z0-9]+','',title.casefold())[:110]
              if key in seen or per_source[name] >= 4: continue
              seen.add(key)
              per_source[name] += 1
              selected.append((stamp, name, title, link))
              if len(selected) >= 20: break
          if len(selected) < 5:
              print(f'Only {len(selected)} eligible headlines; keeping the existing edition unchanged.')
              raise SystemExit(0)

          root = Path('index.html')
          if not root.exists(): raise SystemExit('Missing website index.html')
          source = root.read_text(encoding='utf-8')
          soup = BeautifulSoup(source,'html.parser')
          section = soup.select_one('main#underlined')
          if not section: raise SystemExit('Could not find the Underlined news panel')
          if soup.title:
              number = (now.date() - dt.date(2026,11,11)).days + 1
              soup.title.string = f'Architecture Underlined — Issue {number:02d} · {now.strftime("%B %d, %Y")}'
          issue_meta = soup.select_one('.mini span:last-child')
          if issue_meta:
              issue_meta.string = f'Issue {number:02d} / {now.strftime("%m.%d.%Y")}'
          # Preserve the initial 11/11 edition before publishing a newer issue.
          initial = Path('archive/2026-11-11/index.html')
          if issue != '2026-11-11' and not initial.exists():
              initial.parent.mkdir(parents=True, exist_ok=True)
              initial.write_text(source, encoding='utf-8')

          for old in section.select('a.news-item'): old.decompose()
          insertion = section.select_one('p.intro') or section.select_one('.panel-heading')
          for stamp, name, title, link in selected:
              anchor = soup.new_tag('a',href=link)
              anchor['class'] = 'news-item'
              anchor['target'] = '_blank'
              anchor['rel'] = 'noopener noreferrer'
              h = soup.new_tag('span')
              h['class'] = 'newstitle'; h.string = title
              meta = soup.new_tag('span')
              meta['class'] = 'source'; meta.string = f'{name} · {stamp.strftime("%B %d, %Y")}'
              arrow = soup.new_tag('span')
              arrow['class'] = 'arrow'; arrow.string = '↗'
              anchor.extend([h,meta,arrow])
              insertion.insert_after(anchor)
              insertion = anchor

          # Keep this tab's issue archive in a quiet dropdown, newest first.
          menu = section.select_one('.issue-dropdown .issue-menu')
          summary = section.select_one('.issue-dropdown summary')
          if menu and summary:
              summary.string = now.strftime('%m/%d') + ' issue'
              menu.clear()
              issued = sorted([p.parent.name for p in Path('archive').glob('*/index.html')], reverse=True)
              dates = [issue] + [d for d in issued if d != issue]
              for d in dates:
                  label = dt.date.fromisoformat(d).strftime('%m/%d') + ' issue'
                  a = soup.new_tag('a',href='#underlined' if d == issue else f'/architecture-underlined/archive/{d}/#underlined')
                  a.string = label
                  if d == issue: a['aria-current'] = 'page'
                  menu.append(a)

          # Save both the current page and a dated complete snapshot.
          out = str(soup)
          root.write_text(out,encoding='utf-8')
          archive = Path('archive') / issue / 'index.html'
          archive.parent.mkdir(parents=True, exist_ok=True)
          archive.write_text(out,encoding='utf-8')
          print(f'Published {len(selected)} recent headlines for {issue} with dated snapshot.')
          PY
      - name: Commit published edition and archive
        run: |
          git config user.name 'architecture-underlined-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html archive/
          if git diff --staged --quiet; then
            echo 'No new edition to publish'
          else
            git commit -m "Publish Architecture Underlined headlines and archive [skip ci]"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package current edition and archived editions
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -d archive ]; then cp -r archive _site/archive; fi
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
